# DRAFT F-Droid recipe for fdroiddata (metadata/dev.n62.calc.yml). Never submitted; the application id dev.n62.calc is final (owner, 2026-11-05, decisions.md "The name N62").
# Modelled on net.alexbarry.alexgames (Debian emscripten in the build VM) and com.graphhopper.maps (Capacitor).
# Status: untested in fdroidserver (see fdroid/README.md). commit: v0.1.0 is the tag the owner pushes (tools/check-version.sh checks it against the versions).
# Privacy statement: PRIVACY.md in the repository root.
Categories:
  - Science & Education
License: GPL-3.0-or-later
AuthorName: N62 contributors
WebSite: https://n62.dev/
SourceCode: https://github.com/n62-dev/n62
IssueTracker: https://github.com/n62-dev/n62/issues

AutoName: N62

RepoType: git
Repo: https://github.com/n62-dev/n62.git

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: v0.1.0
    subdir: android/app
    sudo:
      - apt-get update
      # Same Debian emscripten as the release container (P2): 3.1.69+dfsg-3 in trixie (A96: the buildserver-trixie image has it; build-wasm-release.sh pins the same).
      # Then `emcc` is on PATH (EMSDK_DIR=system); EMSCRIPTEN_PKG_VERSION below makes build-wasm.sh refuse any other compiler.
      - apt-get install -y emscripten=3.1.69+dfsg-3 make patch gcc g++ m4 perl xz-utils bzip2 curl python3 pkg-config npm
    gradle:
      - yes
    # A97: F-Droid's reference: "nothing should be built during this prebuild phase"; `build` "runs during the actual build phase ... Use this only for
    # actions that do actual building". The source scanner runs between the two, so prebuild only fetches (SHA-256-checked downloads, npm ci) and
    # everything that compiles or bundles is in `build`. The downloads go to /tmp, outside the scanned tree, so the source scan finds nothing generated.
    # The scan (fdroidserver 2.4.5, scanner.scan_source, measured 2026-11-09 on a clean checkout after this npm ci) flags 7 files under app/node_modules/ (gzip archives
    # in @capacitor/cli/assets, playwright-core's webp_codec.wasm, jsxgraph's jsxcompressor.zip). scandelete removes only the files the scanner flags, not the directory,
    # so Capacitor's Android modules (capacitor.settings.gradle) stay; 57 of 62 Capacitor recipes in fdroiddata list node_modules there. But `cap sync` unpacks
    # android/capacitor-cordova-android-plugins from the one tarball below, so that file is scanignored (it fails ENOENT without it).
    prebuild:
      - cd ../..
      - export N62_DL_DIR=/tmp/n62-dl
      - export N62_QALC_DL_DIR=/tmp/n62-qalc-dl
      - engine/giac/build-wasm.sh --fetch-only
      - engine/qalc/build-wasm.sh dev --fetch-only
      - cd app
      - npm ci
    scanignore:
      - app/node_modules/@capacitor/cli/assets/capacitor-cordova-android-plugins.tar.gz
    scandelete:
      - app/node_modules/
    build:
      - cd ../..
      - export N62_DL_DIR=/tmp/n62-dl
      - export N62_QALC_DL_DIR=/tmp/n62-qalc-dl
      - export EMSDK_DIR=system
      - export EMSCRIPTEN_PKG_VERSION=3.1.69+dfsg-3
      - engine/giac/build-wasm.sh
      # libqalculate for the Find index (milestone 4; the Units worker is milestone 5). Skip with build.sh's --no-units.
      - engine/qalc/build-wasm.sh dev
      - cd app
      # P22 (A60): recompute find/factors.yaml from the qalc build above; any difference exits 1 and fails the build, so F-Droid's own build proves the checked-in file.
      - node ../tools/find-index/refresh-factors.mjs
      - npm run index
      - GIAC_OUT=../engine/giac/_out/gsl npm run build
      - npx cap sync android

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.1.0
CurrentVersionCode: 1
