  - { query: "e24", expect: "fn:eseries", note: "E-series rounding (G30)" }
  - { query: "sigfig", expect: "fn:sigfig", note: "G313: our own sigfig(x, n)" }
  - { query: "significant figures", expect: "fn:sigfig", note: "G313" }
  - { query: "sig figs", expect: "fn:sigfig", note: "G313" }
  - { query: "rms", expect: "fn:rms", note: "tier 1" }
  # G356: not Giac's lagrange (the polynomial through every point); G361: our table interpolation, linterp
  - { query: "interpolate", expect: "fn:linterp", note: "G361" }
  - { query: "interpolation", expect: "fn:linterp", note: "G361" }
  - { query: "lookup", expect: "fn:linterp", note: "G361: a value read from a table" }
  - { query: "table", expect: "fn:linterp", note: "G361: Giac's table (a hash table) is tier 1" }
  - { query: "lagrange", expect: "fn:lagrange", note: "G356, G361: Giac's polynomial keeps its own name" }
  # G401: the engineers' words for functions Find has (night review 2026-11-16, fh-4, fh-5)
  - { query: "simultaneous equations", expect: "fn:linsolve", note: "G401" }
  - { query: "linear system", expect: "fn:linsolve", note: "G401: not desolve (differential equations)" }
  - { query: "solve numerically", expect: "fn:fsolve", note: "G401" }
  - { query: "numerical integration", expect: "fn:romberg", note: "G401: Giac's numeric integral (nInt); int keeps integral" }
  - { query: "trapezoid", expect: "fn:romberg", note: "G401: the rule's word finds the numeric integral" }
  - { query: "partial fractions", expect: "fn:partfrac", note: "G401" }
  - { query: "unit vector", expect: "fn:normalize", note: "G401" }
  - { query: "polar to rectangular", expect: "fn:rectangular_coordinates", note: "G401: (r, θ) to (x, y); no template for it" }
  - { query: "rectangular to polar", expect: "fn:polar_coordinates", note: "G401: (x, y) to (r, θ)" }
  - { query: "permutations", expect: "fn:perm", note: "G401: nPr, not groupermu (a permutation group)" }
