  - { query: "standard error", expect: "fn:sem", note: "G155: s/√n, our passem" }
  - { query: "sem", expect: "fn:sem", note: "G155" }
  - { query: "linear regression", expect: "fn:linreg", note: "G223" }
  - { query: "line of best fit", expect: "fn:linreg", note: "G223" }
  - { query: "linreg", expect: "fn:linreg", note: "G223" }
