  - { query: "power fit", expect: "fn:power_regression", note: "G401: tier 1, y = b·xᵐ" }
  - { query: "logarithmic fit", expect: "fn:logarithmic_regression", note: "G401: tier 1, y = a·ln x + b" }
  - { query: "curve fit", expect: "fn:polynomial_regression", note: "G401: the four regressions carry the words; ties go by id, so this one is third" }
  - { query: "dms", expect: "tmpl:dms", note: "G401: the Tmpl palette's degrees-minutes-seconds template" }
  - { query: "degrees minutes seconds", expect: "tmpl:dms", note: "G401" }
  # Milestone 6 (pending)
  - { query: "hex", expect: "tmpl:base", note: "number bases, EN6", status: pending }
  - { query: "dot product", expect: "fn:dot", note: "curated in EN5", status: pending }
  - { query: "db", expect: "fn:db", note: "the dB function in Home, the dB unit in the unit view (context decides)", status: pending }
  - { query: "bitand", expect: "fn:bitand", note: "EN6", status: pending }

