<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#092726" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>N62</title>
    <script>
      // R50e: the stored look (localStorage mirror) before the first paint; src/theme/look.ts has the rules.
      (function () {
        var r = document.documentElement, l = {}, f = /*theme-css*/{}, w = [];
        function q(m) { return window.matchMedia ? matchMedia(m).matches : false; }
        try { l = JSON.parse(localStorage.getItem("n62.look")) || {}; } catch (e) {}
        var c = window.Capacitor, n = c && c.isNativePlatform && c.isNativePlatform();
        var a = ["n62", "bw", "solarized"].indexOf(l.family) < 0 ? "n62" : l.family;
        var b = ["system", "light", "dark"].indexOf(l.brightness) < 0 ? (n ? "dark" : "system") : l.brightness;
        var h = typeof l.contrast == "boolean" ? l.contrast : q("(prefers-contrast: more)"), p = l.plain === true, s = l.shadow !== false;
        r.setAttribute("data-family", a);
        r.setAttribute("data-brightness", (b == "system" ? q("(prefers-color-scheme: light)") : b == "light") ? "light" : "dark");
        if (h) r.setAttribute("data-contrast", "high");
        if (p) r.setAttribute("data-keys", "plain");
        if (s) r.setAttribute("data-shadow", "on");
        if (a == l.family && /^#[0-9a-f]{3,8}$/i.test(l.bg)) document.querySelector('meta[name="theme-color"]').setAttribute("content", l.bg);
        if (a != "n62" || h || p) w.push(a);
        if (h || p) w.push("modes");
        for (var i = 0; i < w.length; i++)
          if (f[w[i]]) try { document.write('<link rel="stylesheet" href="' + new URL(f[w[i]], document.baseURI).href + '">'); } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Too-old WebView check (ES5, feature detection only). Inline and English: the i18n table is in the bundle.
      // Chrome 111 (R160): color-mix (keys), container units 105 (pad), wasm exceptions 95 (Giac).
      (function () {
        var ok = false; // the bytes: (module (func (try (catch_all))))
        try {
          ok = CSS.supports("color", "color-mix(in srgb,red,blue)") && CSS.supports("width", "1cqi") && WebAssembly.validate(new Uint8Array(
            [0, 97, 115, 109, 1, 0, 0, 0, 1, 4, 1, 96, 0, 0, 3, 2, 1, 0, 10, 8, 1, 6, 0, 6, 64, 25, 11, 11]));
        } catch (e) {}
        if (ok) return;
        var app = document.getElementById("app");
        if (app) app.removeAttribute("id");
        var p = document.createElement("p");
        p.style.cssText = "font:16px sans-serif;padding:24px";
        p.appendChild(document.createTextNode(/; wv\)|Version\/[\d.]+ .*Chrome\//.test(navigator.userAgent) ? "This app needs a newer Android System WebView / Chrome. Update it from your app store." : "This app needs a newer browser. Update it and reload."));
        document.body.insertBefore(p, document.body.firstChild);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
