  strings: [mathml, latex, getType, str, char, tabvar, tabsign, mlr, mc_mean_antithetic]
  # Giac's debugger: debug and interactive_plotode call the browser's prompt() (prompt is not defined); after debug every
  # program call throws (F91, F96)
  debugger: [debug, interactive_plotode]

# G111: the exclude groups the Find census (tools/probes/findcensus) still runs, in their place in Giac's help, and reports as
# left out: an upstream fix moves their classes, and the census shows it.
census: [graphics, graphs, strings, debugger]

# G67: Giac commands that change the engine's state on purpose, kept in Find with our own line saying so (replaces
# Giac's English line).
notes:
  purge: "Changes the engine's state: forgets a stored value or function, also after a relaunch."
  assume: "Changes the engine's state: an assumption on a variable (x>0), kept until purge(x), also after a relaunch."
  additionally: "Changes the engine's state: adds an assumption to a variable's, kept until purge(x)."
