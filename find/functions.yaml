# SPDX-License-Identifier: GPL-3.0-or-later
# Find tier 0: the curated functions (docs/04 3.3). Each one is ranked before Giac's other commands and
# has a golden accuracy case (`golden`: a case id in tests/golden/*.yaml, checked by the generator).
# Titles and descriptions are our own words. Fields:
#   id      the Find id (fn:<Giac command>, or tmpl:<name> for a LaTeX template)
#   title   what the list shows
#   desc    one line, ours
#   names   extra names a user may type (Giac's own names are added from aide_cas, except `drop`)
#   drop    Giac names not to offer for this item (they mean something else in our entry line)
#   insert  the LaTeX the entry line receives (default \operatorname{<name>}\left(#0\right))
#   giac    the Giac command that insert must become through our parser (checked by app/src/find/insert.test.ts)
#   syntax  shown in the preview (default: from aide_cas)
#   golden  the golden case id
#   example { input, expect, mark[, angle] } (G231): one example in our own words; `input` is the LaTeX the entry line holds, `expect` the
#           result Home shows, `mark` the mark before it ("=" exact, "≈" rounded, "" none: a symbolic result; checked against the engine's); `angle` only when the result depends on the angle mode. Run on the engine by app/src/find/examples.test.ts.
# Not tier 0 on purpose (Giac behaviour to settle first, see the G4 report): round (halves go up, round(-2.5) = -2).
functions:
  - { id: "fn:sqrt", title: "Square root", desc: "Square root; of a negative number gives an imaginary result.", names: ["square root", "√"], insert: "\\sqrt{#0}", giac: "sqrt", syntax: "sqrt(x)", golden: "fn-sqrt2", example: { input: "\\sqrt{16}", expect: "4", mark: "=" } }
  - { id: "tmpl:cbrt", title: "Cube root", desc: "Real cube root: ∛(−8) = −2.", names: ["cbrt", "cube root", "∛"], insert: "\\sqrt[3]{#0}", giac: "surd", syntax: "∛x", golden: "fn-cbrt2", example: { input: "\\sqrt[3]{-27}", expect: "-3", mark: "=" } }
  - { id: "fn:surd", title: "Real n-th root", desc: "Real n-th root of x: surd(x, n).", names: ["nth root", "root"], giac: "surd", golden: "fn-cbrt-neg8", example: { input: "\\operatorname{surd}\\left(-32,5\\right)", expect: "-2", mark: "=" } }
  - { id: "fn:ln", title: "Natural logarithm", desc: "Logarithm to base e.", names: ["natural log", "natural logarithm"], drop: ["log", "LN"], insert: "\\ln\\left(#0\\right)", giac: "ln", syntax: "ln(x)", golden: "fn-ln2", example: { input: "\\ln\\left(100\\right)", expect: "4.60517018599", mark: "≈" } }
  - { id: "fn:log10", title: "Common logarithm (log₁₀)", desc: "Logarithm to base 10.", names: ["log", "lg", "common log", "decimal logarithm"], insert: "\\log\\left(#0\\right)", giac: "log10", syntax: "log10(x)", golden: "fn-log10-2", example: { input: "\\log\\left(1000\\right)", expect: "3", mark: "=" } }
  - { id: "fn:exp", title: "Exponential (eˣ)", desc: "e raised to the power x.", names: ["exponential", "e^x"], drop: ["EXP"], insert: "\\exp\\left(#0\\right)", giac: "exp", syntax: "exp(x)", golden: "fn-exp1", example: { input: "\\exp\\left(1\\right)", expect: "2.71828182846", mark: "≈" } }
  - { id: "fn:sin", title: "Sine", desc: "Sine, in the angle unit of the settings.", drop: ["SIN"], insert: "\\sin\\left(#0\\right)", giac: "sin", syntax: "sin(x)", golden: "rad-sin1", example: { input: "\\sin\\left(30\\degree\\right)", expect: "0.5", mark: "=" } }
  - { id: "fn:cos", title: "Cosine", desc: "Cosine, in the angle unit of the settings.", drop: ["COS"], insert: "\\cos\\left(#0\\right)", giac: "cos", syntax: "cos(x)", golden: "rad-cos1", example: { input: "\\cos\\left(180\\degree\\right)", expect: "-1", mark: "=" } }
  - { id: "fn:tan", title: "Tangent", desc: "Tangent, in the angle unit of the settings.", drop: ["TAN"], insert: "\\tan\\left(#0\\right)", giac: "tan", syntax: "tan(x)", golden: "rad-tan1", example: { input: "\\tan\\left(45\\degree\\right)", expect: "1", mark: "=" } }
  - { id: "fn:asin", title: "Arcsine (sin⁻¹)", desc: "Inverse sine, in the angle unit of the settings.", names: ["inverse sine"], drop: ["ASIN"], insert: "\\arcsin\\left(#0\\right)", giac: "asin", syntax: "asin(x)", golden: "rad-asin0.5", example: { input: "\\arcsin\\left(0.5\\right)", expect: "0.523598775598", mark: "≈", angle: "rad" } }
  - { id: "fn:acos", title: "Arccosine (cos⁻¹)", desc: "Inverse cosine, in the angle unit of the settings.", names: ["inverse cosine"], insert: "\\arccos\\left(#0\\right)", giac: "acos", syntax: "acos(x)", golden: "rad-acos0.3", example: { input: "\\arccos\\left(0\\right)", expect: "1.57079632679", mark: "≈", angle: "rad" } }
  - { id: "fn:atan", title: "Arctangent (tan⁻¹)", desc: "Inverse tangent, in the angle unit of the settings.", names: ["inverse tangent"], drop: ["ATAN"], insert: "\\arctan\\left(#0\\right)", giac: "atan", syntax: "atan(x)", golden: "rad-atan10", example: { input: "\\arctan\\left(1\\right)", expect: "0.785398163397", mark: "≈", angle: "rad" } }
  - { id: "fn:sinh", title: "Hyperbolic sine", desc: "Hyperbolic sine.", insert: "\\sinh\\left(#0\\right)", giac: "sinh", syntax: "sinh(x)", golden: "rad-sinh1", example: { input: "\\sinh\\left(1\\right)", expect: "1.17520119364", mark: "≈" } }
  - { id: "fn:cosh", title: "Hyperbolic cosine", desc: "Hyperbolic cosine.", drop: ["COSH"], insert: "\\cosh\\left(#0\\right)", giac: "cosh", syntax: "cosh(x)", golden: "fn-cosh1", example: { input: "\\cosh\\left(1\\right)", expect: "1.54308063482", mark: "≈" } }
  - { id: "fn:tanh", title: "Hyperbolic tangent", desc: "Hyperbolic tangent.", insert: "\\tanh\\left(#0\\right)", giac: "tanh", syntax: "tanh(x)", golden: "rad-tanh0.5", example: { input: "\\tanh\\left(1\\right)", expect: "0.761594155956", mark: "≈" } }
  - { id: "fn:abs", title: "Absolute value", desc: "Absolute value |x|; the modulus of a complex number.", names: ["absolute value", "modulus", "magnitude"], giac: "abs", syntax: "abs(x)", golden: "int-abs-0.3", example: { input: "\\operatorname{abs}\\left(3+4\\imaginaryI\\right)", expect: "5", mark: "=" } }
  - { id: "fn:floor", title: "Floor", desc: "Largest integer ≤ x.", names: ["round down"], giac: "floor", syntax: "floor(x)", golden: "int-floor2.5", example: { input: "\\operatorname{floor}\\left(-2.5\\right)", expect: "-3", mark: "=" } }
  - { id: "fn:ceil", title: "Ceiling", desc: "Smallest integer ≥ x.", names: ["round up"], giac: "ceil", syntax: "ceil(x)", golden: "int-ceil-2.5", example: { input: "\\operatorname{ceil}\\left(2.1\\right)", expect: "3", mark: "=" } }
  - { id: "fn:frac", title: "Fractional part", desc: "x minus its integer part.", names: ["fractional part"], giac: "frac", syntax: "frac(x)", golden: "int-frac2.7", example: { input: "\\operatorname{frac}\\left(2.75\\right)", expect: "0.75", mark: "=" } }
  - { id: "fn:irem", title: "Remainder (mod)", desc: "Remainder of the integer division a ÷ b; never negative.", names: ["mod", "modulo", "remainder"], giac: "irem", syntax: "irem(a, b)", golden: "fn-irem-neg", example: { input: "\\operatorname{irem}\\left(-7,3\\right)", expect: "2", mark: "=" } }
  - { id: "fn:gcd", title: "Greatest common divisor", desc: "Greatest common divisor of integers or polynomials.", names: ["greatest common divisor", "hcf"], giac: "gcd", syntax: "gcd(a, b)", golden: "fn-gcd", example: { input: "\\operatorname{gcd}\\left(12,18\\right)", expect: "6", mark: "=" } }
  - { id: "fn:lcm", title: "Least common multiple", desc: "Least common multiple of integers or polynomials.", names: ["least common multiple"], giac: "lcm", syntax: "lcm(a, b)", golden: "fn-lcm", example: { input: "\\operatorname{lcm}\\left(4,6\\right)", expect: "12", mark: "=" } }
  - { id: "fn:factorial", title: "Factorial (n!)", desc: "n!; for non-integers Γ(n+1).", names: ["n!"], giac: "factorial", syntax: "factorial(n)", golden: "fn-factorial0.5", example: { input: "\\operatorname{factorial}\\left(5\\right)", expect: "120", mark: "=" } }
  - { id: "fn:median", title: "Median (mean of the two middle values for an even count)", desc: "Middle value of a sorted list; for an even count the mean of the two middle ones.", names: ["middle value"], giac: "pasmedian", syntax: "median(list)", golden: "g42-median-even", example: { input: "\\operatorname{median}\\left(\\left\\{1,3,2,10\\right\\}\\right)", expect: "2.5", mark: "=" } }
  - { id: "fn:percentile", title: "Percentile (linear interpolation between the closest ranks, rank p/100·(n−1))", desc: "p-th percentile of a list, 0 ≤ p ≤ 100, linear interpolation between the closest ranks.", giac: "paspercentile", syntax: "percentile(list, p)", golden: "g42-percentile-50", example: { input: "\\operatorname{percentile}\\left(\\left\\{10,20,30,40\\right\\},25\\right)", expect: "17.5", mark: "=" } }
  - { id: "fn:comb", title: "Combinations (nCr)", desc: "Number of ways to choose r of n: n! ÷ (r!(n−r)!).", names: ["ncr", "combinations", "binomial coefficient", "choose"], giac: "comb", syntax: "comb(n, r)", golden: "fn-comb", example: { input: "\\operatorname{comb}\\left(5,2\\right)", expect: "10", mark: "=" } }
  - { id: "fn:Gamma", title: "Gamma function (Γ)", desc: "Euler's gamma function; Γ(n) = (n−1)!.", names: ["gamma", "Γ"], giac: "Gamma", syntax: "Gamma(x)", golden: "fn-gamma0.5", example: { input: "\\operatorname{Gamma}\\left(5\\right)", expect: "24", mark: "=" } }
  - { id: "fn:erf", title: "Error function", desc: "Gauss error function erf(x).", names: ["error function"], giac: "erf", syntax: "erf(x)", golden: "fn-erf0.5", example: { input: "\\operatorname{erf}\\left(0.5\\right)", expect: "0.520499877813", mark: "≈" } }
  - { id: "fn:mean", title: "Mean (average)", desc: "Arithmetic mean of a list; an optional second list gives weights.", names: ["average", "avg", "arithmetic mean"], giac: "mean", syntax: "mean(list)", golden: "stat-mean", example: { input: "\\operatorname{mean}\\left(\\left\\{1,2,3,4\\right\\}\\right)", expect: "2.5", mark: "=" } }
  - { id: "fn:stddevp", title: "Standard deviation (sample, n−1)", desc: "Sample standard deviation of a list (divides by n−1).", names: ["stdev", "sample standard deviation", "standard deviation", "std", "sd"], giac: "stddevp", syntax: "stddevp(list)", golden: "stat-stddevp-sample", example: { input: "\\operatorname{stddevp}\\left(\\left\\{2,4,4,4,5,5,7,9\\right\\}\\right)", expect: "2.1380899353", mark: "≈" } }
  - { id: "fn:sem", title: "Standard error of the mean (s/√n)", desc: "Sample standard deviation of a list divided by √n: the standard error of its mean.", names: ["standard error", "standard error of the mean", "sem"], giac: "passem", syntax: "sem(list)", golden: "g155-sem-t09", example: { input: "\\operatorname{sem}\\left(\\left\\{2,4,4,4,5,5,7,9\\right\\}\\right)", expect: "0.755928946018", mark: "≈" } }
  - { id: "fn:stddev", title: "Standard deviation (population, n)", desc: "Population standard deviation of a list (divides by n).", names: ["stdevp", "population standard deviation", "σ"], giac: "stddev", syntax: "stddev(list)", golden: "stat-stddev-population", example: { input: "\\operatorname{stddev}\\left(\\left\\{2,4,4,4,5,5,7,9\\right\\}\\right)", expect: "2", mark: "=" } }
  - { id: "fn:variance", title: "Variance (population, n)", desc: "Population variance of a list (divides by n).", names: ["var"], giac: "variance", syntax: "variance(list)", golden: "stat-variance", example: { input: "\\operatorname{variance}\\left(\\left\\{2,4,4,4,5,5,7,9\\right\\}\\right)", expect: "4", mark: "=" } }
  - { id: "fn:stats1", title: "Summary statistics (n, mean, s, σ, min, max)", desc: "Of one list: count, mean, sample deviation s (n−1), population deviation σ (n), min and max; exact for exact data.", names: ["summary statistics", "descriptive statistics", "statistics", "one-variable statistics"], giac: "stats1", syntax: "stats1(list)", golden: "g223-stats1", example: { input: "\\operatorname{stats1}\\left(\\left\\{1,2,3,4\\right\\}\\right)", expect: "{4,2.5,1.29099444874,1.11803398875,1,4}", mark: "≈" } }
  - { id: "fn:linreg", title: "Linear regression (slope, intercept, r²)", desc: "Least-squares line y = slope·x + intercept through paired lists, with r²; exact for exact data.", names: ["linear regression", "regression", "least squares", "line of best fit", "r squared", "r²", "trend line"], giac: "linreg", syntax: "linreg(xlist, ylist)", golden: "g223-linreg", example: { input: "\\operatorname{linreg}\\left(\\left\\{1,2,3,4\\right\\},\\left\\{2.1,3.9,6.2,7.8\\right\\}\\right)", expect: "{1.94,0.15,0.995661375661}", mark: "≈" } }
  - { id: "fn:normald_cdf", title: "Normal cumulative distribution", desc: "P(X ≤ x) for a normal distribution: normald_cdf(x) or normald_cdf(μ, σ, x).", names: ["normal cdf", "normcdf", "Φ"], giac: "normald_cdf", syntax: "normald_cdf(μ, σ, x)", golden: "stat-normald_cdf1.96", example: { input: "\\operatorname{normald_cdf}\\left(1.96\\right)", expect: "0.975002104852", mark: "≈" } }
  - { id: "fn:normald", title: "Normal density", desc: "Height of the normal (bell) curve with mean μ and deviation σ at x: normald(μ, σ, x); normald(x) is the standard one.", names: ["normal density", "normal pdf", "normal distribution", "gaussian", "bell curve", "normpdf"], giac: "normald", syntax: "normald(μ, σ, x)", golden: "g222-normald-10-2-12", example: { input: "\\operatorname{normald}\\left(10,2,12\\right)", expect: "0.12098536226", mark: "≈" } }
  - { id: "fn:normald_icdf", title: "Inverse normal", desc: "The x below which a normal distribution has probability p: normald_icdf(μ, σ, p); normald_icdf(p) is the standard one.", names: ["inverse normal", "normal inverse", "normal quantile", "normal percentile", "probit", "norminv", "z score"], giac: "normald_icdf", syntax: "normald_icdf(μ, σ, p)", golden: "g47-normald_icdf-0.975", example: { input: "\\operatorname{normald_icdf}\\left(0.975\\right)", expect: "1.95996398454", mark: "≈" } }
  - { id: "fn:student", title: "Student t density", desc: "Height of the Student t curve with ν degrees of freedom at x: student(ν, x).", names: ["student t", "t distribution", "t test", "t density", "t pdf", "student density"], giac: "student", syntax: "student(ν, x)", golden: "g222-student-5-2", example: { input: "\\operatorname{student}\\left(5,2\\right)", expect: "0.0650903103262", mark: "≈" } }
  - { id: "fn:student_cdf", title: "Student t cumulative", desc: "P(T ≤ x) for the Student t distribution with ν degrees of freedom: student_cdf(ν, x).", names: ["student t cdf", "t cdf", "t distribution cumulative", "t probability", "t test"], giac: "student_cdf", syntax: "student_cdf(ν, x)", golden: "g169-student-cdf-scalar", example: { input: "\\operatorname{student_cdf}\\left(3,0.5\\right)", expect: "0.674276017576", mark: "≈" } }
  - { id: "fn:student_icdf", title: "Inverse t", desc: "The x below which a Student t distribution with ν degrees of freedom has probability p: student_icdf(ν, p).", names: ["inverse t", "t inverse", "t quantile", "t critical value", "student t inverse", "t test", "tinv"], giac: "student_icdf", syntax: "student_icdf(ν, p)", golden: "prec-g44-student_icdf-5-0.975-12", example: { input: "\\operatorname{student_icdf}\\left(5,0.975\\right)", expect: "2.57058183564", mark: "≈" } }
  - { id: "fn:int", title: "Integral", desc: "Antiderivative int(f, x), or the definite integral int(f, x, a, b).", names: ["integral", "integrate", "antiderivative", "∫"], giac: "int", syntax: "int(f, x, a, b)", golden: "fn-int-sinx/x", example: { input: "\\operatorname{int}\\left(x^2,x,0,3\\right)", expect: "9", mark: "=" } }
  - { id: "fn:diff", title: "Derivative", desc: "Derivative of an expression: diff(f, x).", names: ["derivative", "differentiate"], giac: "diff", syntax: "diff(f, x)", golden: "cas-diff-at", example: { input: "\\operatorname{diff}\\left(x^3,x\\right)", expect: "3*x^2", mark: "" } }
  - { id: "fn:limit", title: "Limit", desc: "Limit of an expression: limit(f, x, a).", names: ["lim"], giac: "limit", syntax: "limit(f, x, a)", golden: "cas-limit-sinc", example: { input: "\\operatorname{limit}\\left(\\frac{x^2-1}{x-1},x,1\\right)", expect: "2", mark: "=" } }
  - { id: "fn:solve", title: "Solve an equation", desc: "Exact or numeric solutions of an equation or system: solve(eq, x).", names: ["equation", "roots"], giac: "solve", syntax: "solve(eq, x)", golden: "cas-solve-sqrt2", example: { input: "\\operatorname{solve}\\left(x^2-5x+6=0,x\\right)", expect: "{2,3}", mark: "=" } }
  - { id: "fn:det", title: "Determinant", desc: "Determinant of a square matrix.", names: ["determinant"], giac: "det", syntax: "det(M)", golden: "mat-det", example: { input: "\\operatorname{det}\\left(\\begin{pmatrix}1&2\\\\3&4\\end{pmatrix}\\right)", expect: "-2", mark: "=" } }
  - { id: "fn:inv", title: "Inverse (matrix)", desc: "Inverse of a square matrix, or 1/x.", names: ["inverse", "inverse matrix", "matrix inverse"], giac: "inv", syntax: "inv(M)", golden: "mat-inv", example: { input: "\\operatorname{inv}\\left(\\begin{pmatrix}1&2\\\\3&4\\end{pmatrix}\\right)", expect: "[[-2,1],[1.5,-0.5]]", mark: "=" } }
  - { id: "fn:tran", title: "Transpose", desc: "Transpose of a matrix.", names: ["transpose"], giac: "tran", syntax: "tran(M)", golden: "mat-tran", example: { input: "\\operatorname{tran}\\left(\\begin{pmatrix}1&2\\\\3&4\\end{pmatrix}\\right)", expect: "[[1,3],[2,4]]", mark: "=" } }
  - { id: "fn:cross", title: "Cross product", desc: "Cross product of two 3-vectors.", names: ["cross product", "vector product"], giac: "cross", syntax: "cross(u, v)", golden: "vec-cross", example: { input: "\\operatorname{cross}\\left(\\left\\{1,0,0\\right\\},\\left\\{0,1,0\\right\\}\\right)", expect: "{0,0,1}", mark: "=" } }
  - { id: "fn:par", title: "Resistors in parallel", desc: "1/(1/a + 1/b + …) for any number of values, exact; a zero gives 0.", names: ["parallel", "‖", "resistors in parallel"], giac: "par", syntax: "par(a, b, …)", golden: "fn-par", example: { input: "\\operatorname{par}\\left(10,15\\right)", expect: "6", mark: "=" } }
  - { id: "fn:eseries", title: "Preferred value (E series)", desc: "The IEC 60063 value of E6, E12, E24, E48, E96 or E192 nearest to x, in x's decade: eseries(24, 3870) = 3900.", names: ["e24", "e12", "e96", "preferred value", "standard resistor"], giac: "eseries", syntax: "eseries(n, x)", golden: "fn-eseries", example: { input: "\\operatorname{eseries}\\left(24,3870\\right)", expect: "3900", mark: "=" } }
  - { id: "fn:bitand", title: "Bitwise AND", desc: "AND of the bits of two integers; negative numbers count as two's complement: bitand(-1, 255) = 255.", names: ["and", "bit and", "bitwise and", "mask"], giac: "bitand", syntax: "bitand(a, b)", golden: "g235-bitand-neg", example: { input: "\\operatorname{bitand}\\left(-1,255\\right)", expect: "255", mark: "=" } }
  - { id: "fn:bitor", title: "Bitwise OR", desc: "OR of the bits of two integers: bitor(12, 10) = 14.", names: ["or", "bit or", "bitwise or"], giac: "bitor", syntax: "bitor(a, b)", golden: "g235-bitor", example: { input: "\\operatorname{bitor}\\left(12,10\\right)", expect: "14", mark: "=" } }
  - { id: "fn:bitxor", title: "Bitwise XOR", desc: "Exclusive OR of the bits of two integers: bitxor(12, 10) = 6.", names: ["xor", "exclusive or", "bit xor", "bitwise xor"], giac: "bitxor", syntax: "bitxor(a, b)", golden: "g235-bitxor", example: { input: "\\operatorname{bitxor}\\left(12,10\\right)", expect: "6", mark: "=" } }
  - { id: "fn:bnot", title: "Bitwise NOT (word)", desc: "Every bit of a word flipped; the word size is 8, 16, 32 or 64 bits (default 64), signed 0 or 1 (default unsigned): bnot(5, 8, 0) = 250.", names: ["not", "bit not", "bitwise not", "invert bits", "complement", "ones complement"], giac: "bnot", syntax: "bnot(x, word, signed)", golden: "g229-bnot-8", example: { input: "\\operatorname{bnot}\\left(5,8,0\\right)", expect: "250", mark: "=" } }
  - { id: "fn:shl", title: "Shift left (word)", desc: "Shift the bits of x left by n places in a word of 8, 16, 32 or 64 bits (default 64), signed 0 or 1 (default unsigned); bits shifted out are lost: shl(1, 7, 8, 0) = 128.", names: ["shift", "shift left", "left shift", "shl", "<<"], giac: "shl", syntax: "shl(x, n, word, signed)", golden: "g229-shl-8-top", example: { input: "\\operatorname{shl}\\left(1,7,8,0\\right)", expect: "128", mark: "=" } }
  - { id: "fn:shr", title: "Shift right (word)", desc: "Shift the bits of x right by n places in a word of 8, 16, 32 or 64 bits (default 64); a signed word copies its sign bit in: shr(-128, 1, 8, 1) = -64.", names: ["shift", "shift right", "right shift", "shr", ">>"], giac: "shr", syntax: "shr(x, n, word, signed)", golden: "g229-shr-8", example: { input: "\\operatorname{shr}\\left(-128,1,8,1\\right)", expect: "-64", mark: "=" } }
  - { id: "fn:rotl", title: "Rotate left (word)", desc: "Turn the bits of x left by n places, the top bits coming round to the bottom, in a word of 8, 16, 32 or 64 bits (default 64): rotl(129, 1, 8, 0) = 3.", names: ["rotate", "rotate left", "left rotation", "rol"], giac: "rotl", syntax: "rotl(x, n, word, signed)", golden: "g229-rotl-8", example: { input: "\\operatorname{rotl}\\left(129,1,8,0\\right)", expect: "3", mark: "=" } }
  - { id: "fn:rotr", title: "Rotate right (word)", desc: "Turn the bits of x right by n places, the low bits coming round to the top, in a word of 8, 16, 32 or 64 bits (default 64): rotr(1, 1, 8, 0) = 128.", names: ["rotate", "rotate right", "right rotation", "ror"], giac: "rotr", syntax: "rotr(x, n, word, signed)", golden: "g229-rotr-8", example: { input: "\\operatorname{rotr}\\left(1,1,8,0\\right)", expect: "128", mark: "=" } }

# Giac commands left out of the index: they need Xcas's windows, turtle, files, folders, sound or command
# history, none of which exists in N62 (Giac's own ans() is not our Ans). Entries whose English line says
# they are options, pseudo-variables, program instructions or reserved words are left out by the generator.
exclude:
  turtle: [efface, dessine_tortue, avance, recule, saute, pas_de_cote, tourne_droite, tourne_gauche, leve_crayon, baisse_crayon, crayon, position, cap, vers, rond, disque, disque_centre, rectangle_plein, triangle_plein, polygone_rempli, repete, debut_enregistrement, fin_enregistrement, cache_tortue, montre_tortue]
  screens: [DispG, DispHome, ClrIO, ClrGraph, erase, erase3d, gnuplot, ecris, NewPic, RclPic, RplcPic, CyclePic, StoPic, switch_axes, xyztrange, Ox_2d_unit_vector, Oy_2d_unit_vector, Ox_3d_unit_vector, Oy_3d_unit_vector, Oz_3d_unit_vector, frame_2d, frame_3d, set_screen, set_pixel, draw_line, draw_rectangle, draw_polygon, draw_circle, draw_arc, clear, show_pixels, pixon, pixoff, click, widget_size, graph2tex, graph3d2tex]
  files: [save_history, read, write, csv2gen, open, fopen, fclose, fprint, readwav, writewav, playsnd, readrgb, writergb, Archive, Unarchiv, archive, unarchive, NewFold, SetFold, DelFold, GetFold, VARS, export_graph, import_graph, maple2xcas, mupad2xcas, maple2mupad, mupad2maple, insmod, lsmod, rmmod, cd, pwd]
