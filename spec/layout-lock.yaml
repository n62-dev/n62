# SPDX-License-Identifier: GPL-3.0-or-later
# The layout lock (R291; docs/06 section 3b): every live key layer and every fixed row of a numbered list, as the app builds
# them. app/src/keyboard/layoutLock.test.ts (in `npm test`, so in the gate) compares it with spec/keyboard.yaml and the lists.
#
# From the v0.1.0 tag on nothing that works moves. A live line here is NEVER edited or deleted. What may change:
#   - growth into blank space: a `reserved` line turns into the live one (the fill), or a line is appended after a list's
#     last fixed row (its next digit); a palette's new cell is a new `row,col` line. Each is a new or changed-from-reserved line.
#   - a move (a change to a live line, or a removal: to `reserved`) is a line under `moves:` that names the entry as
#     `<section>/<slot>`, the old value (`from`), the new one (`to`), the version it lands in and the title of the decisions.md
#     entry that holds the owner's yes. The test applies the moves on top of the lines and checks the title is in decisions.md.
# The test also reads the last release tag's lock (`vX.Y.Z`; a pre-release such as a beta pins nothing; `git show`) and fails if
# a live line pinned there is missing or edited.
#
# Sections (`section/slot`): layers `<key id>.<layer>` = `<kind> <name>` | reserved; tmpl, relations, symbols, chars (the palettes of
# Tmpl, Shift + 6, Shift + 9, Shift + Vars): `row,col` = the cell's id; home-menu, home-copy (☰ in Home and CAS; R720), mode (Mode's rows),
# settings (Settings' sections: Your keys and Data are in the shipped app, so all seven are pinned), apps, base (Shift + −),
# matrix (Shift + 4; New is row 9), function-symb / function-plot / function-num and solve-symb / solve-num (each app view's ☰, Plot
# with an answer and Solve with an unknown selected, so their last rows are there), stat-linreg and stat-stats1 (R184's sheets),
# units-menu (the unit Find's category rows), units-cell (its "put on a cell" sheet, U1 to U6), bar (the bar's controls left to
# right, R722) and folded-bar (the folded bar's, R724): `digit` = the row's id. Rows of stored content (names, matrices) are not pinned.
# modifiers (R726): `<key>.<gesture>` = the state it leaves (off, arm, lock, capsLock, lowerLock, lower), built by running a Session.
# app/src/keyboard/layoutLock.ts LIST_BUILDERS names the files that build each list; a file that opens a new one must be there.
