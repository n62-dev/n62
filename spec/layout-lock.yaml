# The layout lock (R291; docs/06 section 3b): every live key layer and every fixed row of a numbered list, as the app builds
# them. app/src/keyboard/layoutLock.test.ts (in `npm test`, so in the gate) compares it with spec/keyboard.yaml and the lists.
#
# From the v0.1.0 tag on nothing that works moves. A live line here is NEVER edited or deleted. What may change:
#   - growth into blank space: a `reserved` line turns into the live one (the fill), or a line is appended after a list's
#     last fixed row (its next digit); a palette's new cell is a new `row,col` line. Each is a new or changed-from-reserved line.
#   - a move (a change to a live line, or a removal: to `reserved`) is a line under `moves:` that names the entry as
#     `<section>/<slot>`, the old value (`from`), the new one (`to`), the version it lands in and the title of the decisions.md
#     entry that holds the owner's yes. The test applies the moves on top of the lines and checks the title is in decisions.md.
# The test also reads the last `v*` tag's lock (`git show`) and fails if a live line pinned there is missing or edited.
#
# Sections (`section/slot`): layers `<key id>.<layer>` = `<kind> <name>` | reserved; tmpl, relations, symbols (the palettes of
# Tmpl, Shift + 6, Shift + 9): `row,col` = the cell's id; home-menu, home-copy-as (☰ in Home and CAS), mode (Mode's rows),
# settings (Settings' sections: Your keys and Data are in the shipped app, so all seven are pinned), apps, base (Shift + −),
# matrix (Shift + 4): `digit` = the row's id. Rows of stored content (names, matrices) are not pinned.
schema: 1
layers:
  "up.primary": "cmd moveUp"
  "menu.primary": "special menu"
  "menu.shift": "special settings"
  "esc.primary": "special esc"
  "esc.shift": "special clear"
  "left.primary": "cmd moveToPreviousChar"
  "right.primary": "cmd moveToNextChar"
  "undo.primary": "cmd undo"
  "undo.shift": "cmd moveToMathfieldStart"
  "redo.primary": "cmd redo"
  "redo.shift": "cmd moveToMathfieldEnd"
  "down.primary": "cmd moveDown"
  "select.primary": "special selectGrow"
  "select.shift": "special help"
  "deselect.primary": "special selectShrink"
  "deselect.shift": "reserved"
  "vars.primary": "special vars"
  "vars.shift": "reserved"
  "vars.alpha": "type A"
  "math.primary": "special find"
  "math.shift": "special memory"
  "math.alpha": "type B"
  "tmpl.primary": "special tmpl"
  "tmpl.shift": "special units"
  "tmpl.alpha": "type C"
  "x.primary": "type x"
  "x.shift": "type y"
  "x.alpha": "type D"
  "frac.primary": "insert \\frac{#@}{#?} | line insert \\div"
  "frac.shift": "reserved"
  "frac.alpha": "type E"
  "bksp.primary": "cmd deleteBackward"
  "bksp.shift": "cmd deleteForward"
  "pow.primary": "insert #@^{#?} | line insert \\char\"5E "
  "pow.shift": "insert \\sqrt[#?]{#0}"
  "pow.alpha": "type F"
  "sin.primary": "insert \\sin\\left(#0\\right)"
  "sin.shift": "insert \\arcsin\\left(#0\\right)"
  "sin.alpha": "type G"
  "cos.primary": "insert \\cos\\left(#0\\right)"
  "cos.shift": "insert \\arccos\\left(#0\\right)"
  "cos.alpha": "type H"
  "tan.primary": "insert \\tan\\left(#0\\right)"
  "tan.shift": "insert \\arctan\\left(#0\\right)"
  "tan.alpha": "type I"
  "ln.primary": "insert \\ln\\left(#0\\right)"
  "ln.shift": "insert \\exponentialE^{#0}"
  "ln.alpha": "type J"
  "log.primary": "insert \\log\\left(#0\\right)"
  "log.shift": "insert 10^{#0}"
  "log.alpha": "type K"
  "sq.primary": "insert #@^{2} | line insert \\char\"5E 2"
  "sq.shift": "insert \\sqrt{#0} | line insert \\operatorname{sqrt}\\left(#0\\right)"
  "sq.alpha": "type L"
  "neg.primary": "type -"
  "neg.shift": "insert \\left|#0\\right|"
  "neg.alpha": "type M"
  "paren.primary": "insert \\left(#0\\right)"
  "paren.shift": "reserved"
  "paren.alpha": "type N"
  "comma.primary": "type ,"
  "comma.shift": "insert \\pm"
  "comma.alpha": "type O"
  "enter.primary": "special enter"
  "enter.shift": "insert \\operatorname{approx}\\left(#0\\right)"
  "emark.primary": "insert \\emark"
  "emark.shift": "insert \\blacktriangleright"
  "emark.alpha": "type P"
  "d7.primary": "type 7"
  "d7.shift": "reserved"
  "d7.alpha": "type Q"
  "d8.primary": "type 8"
  "d8.shift": "insert \\left\\{#0\\right\\} | line insert \\left\\{#0\\right\\}"
  "d8.alpha": "type R"
  "d9.primary": "type 9"
  "d9.shift": "special symbols"
  "d9.alpha": "type S"
  "div.primary": "insert \\frac{#@}{#?} | line insert \\div"
  "div.shift": "insert #@^{-1} | line insert \\left(#@\\right)^{-1}"
  "div.alpha": "type T"
  "alpha.primary": "special alpha"
  "d4.primary": "type 4"
  "d4.shift": "special matrix"
  "d4.alpha": "type U"
  "d5.primary": "type 5"
  "d5.shift": "insert \\begin{pmatrix}#0\\end{pmatrix}"
  "d5.alpha": "type V"
  "d6.primary": "type 6"
  "d6.shift": "special relations"
  "d6.alpha": "type W"
  "mul.primary": "insert \\times"
  "mul.shift": "insert \\mathbin{\\measuredangle}"
  "mul.alpha": "type X"
  "shift.primary": "special shift"
  "d1.primary": "type 1"
  "d1.shift": "reserved"
  "d1.alpha": "type Y"
  "d2.primary": "type 2"
  "d2.shift": "insert \\imaginaryI"
  "d2.alpha": "type Z"
  "d3.primary": "type 3"
  "d3.shift": "insert \\pi"
  "d3.alpha": "type #"
  "sub.primary": "type -"
  "sub.shift": "special base"
  "sub.alpha": "type :"
  "fmt.primary": "special fmt"
  "fmt.shift": "special mode"
  "d0.primary": "type 0"
