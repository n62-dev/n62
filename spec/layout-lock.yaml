  "sq.alpha": "type L"
  "neg.primary": "type -"
  "neg.shift": "insert \\left|#0\\right|"
  "neg.alpha": "type M"
  "paren.primary": "insert \\left(#0\\right)"
  "paren.shift": "insert \\operatorname{par}\\left(#0\\right)"
  "paren.alpha": "type N"
  "comma.primary": "type ,"
  "comma.shift": "insert \\pm"
  "comma.alpha": "type O"
  "enter.primary": "special enter"
  "enter.shift": "insert \\operatorname{approx}\\left(#0\\right)"
  "emark.primary": "insert \\emark"
  "emark.shift": "insert \\blacktriangleright"
  "emark.alpha": "type P"
  "d7.primary": "type 7"
  "d7.shift": "reserved"
  "d7.alpha": "type Q"
  "d8.primary": "type 8"
  "d8.shift": "insert \\left\\{#0\\right\\} | line insert \\left\\{#0\\right\\}"
  "d8.alpha": "type R"
  "d9.primary": "type 9"
  "d9.shift": "special symbols"
  "d9.alpha": "type S"
  "div.primary": "insert \\frac{#@}{#?} | line insert \\div"
  "div.shift": "insert #@^{-1} | line insert \\left(#@\\right)^{-1}"
  "div.alpha": "type T"
  "alpha.primary": "special alpha"
  "d4.primary": "type 4"
  "d4.shift": "special matrix"
  "d4.alpha": "type U"
  "d5.primary": "type 5"
  "d5.shift": "insert \\begin{pmatrix}#0\\end{pmatrix}"
  "d5.alpha": "type V"
  "d6.primary": "type 6"
  "d6.shift": "special relations"
  "d6.alpha": "type W"
  "mul.primary": "insert \\times"
  "mul.shift": "insert \\mathbin{\\measuredangle}"
  "mul.alpha": "type X"
  "shift.primary": "special shift"
  "d1.primary": "type 1"
  "d1.shift": "special uncertainty"
  "d1.alpha": "type Y"
  "d2.primary": "type 2"
  "d2.shift": "insert \\imaginaryI"
  "d2.alpha": "type Z"
  "d3.primary": "type 3"
  "d3.shift": "insert \\pi"
  "d3.alpha": "type #"
  "sub.primary": "type -"
  "sub.shift": "special base"
  "sub.alpha": "type :"
  "fmt.primary": "special fmt"
  "fmt.shift": "reserved"
  "d0.primary": "type 0"
  "d0.shift": "insert \\%"
  "dot.primary": "type ."
  "dot.shift": "type ="
  "space.primary": "type  "
  "space.shift": "type _"
  "add.primary": "type +"
  "add.shift": "insert \\ans"
  "add.alpha": "type ;"
